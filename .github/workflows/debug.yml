name: Debug build

on:
  push:
    branches: [main, 17u-port, 17u-upstream-merge, xiaomi-17u]
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug, or benchmark (optimized native/Kotlin, installs alongside as Rawr Benchmark)"
        type: choice
        options: [debug, benchmark]
        default: debug
      skip_tests:
        description: "Skip unit tests (assemble only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Repository variable RUNNER=self-hosted sends the job to the self-hosted runner (mini PC, WSL2); delete the
    # variable to go back to GitHub's runners. Pull requests always use GitHub's runners.
    runs-on: ${{ github.event_name != 'pull_request' && vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      # Shows where the build runs: "Runner: dragon-rawr-dev" on the mini PC, "Runner: GitHub Actions …" otherwise
      - name: "Runner: ${{ runner.name }}"
        run: echo "### Runner \`$RUNNER_NAME\` - $(nproc) CPUs, $(free -g | awk '/^Mem:/{print $2}') GB RAM" >> "$GITHUB_STEP_SUMMARY"

      # Self-hosted: keep the previous checkout's build outputs (incremental Gradle/CMake build).
      - uses: actions/checkout@v4
        with:
          clean: ${{ vars.RUNNER != 'self-hosted' }}

      - name: Host video policy regression tests
        run: |
          mkdir -p tmp/host-tests
          c++ -std=c++20 -Wall -Wextra -Werror -UNDEBUG -Iapp/src/main/cpp \
            tests/native/video_acquire_policy_test.cpp -o tmp/host-tests/video_acquire_policy_test
          tmp/host-tests/video_acquire_policy_test
          c++ -std=c++20 -Wall -Wextra -Werror -UNDEBUG -Iapp/src/main/cpp \
            tests/native/video_encoder_prewarm_policy_test.cpp -o tmp/host-tests/video_encoder_prewarm_policy_test
          tmp/host-tests/video_encoder_prewarm_policy_test

      # Fixed debug key kept as a repo secret (base64), so every CI APK installs
      # over the previous one. Without the secret the default debug key is used.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          fi

      # The NDK download (~1 GB) dominates setup: keep it between runs.
      # (GitHub's runners only: the self-hosted runner keeps its SDK/NDK on disk)
      - uses: actions/cache@v4
        if: vars.RUNNER != 'self-hosted'
        with:
          path: /usr/local/lib/android/sdk/ndk/29.0.14206865
          key: ndk-29.0.14206865

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Explicit packages: the action's default list still names the removed
      # 'tools' package. Versions pinned in app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6

      # native/image_scopes embeds its SPIR-V through `uv run`.
      - uses: astral-sh/setup-uv@v6

      # Saves the Gradle cache from every branch (by default only the default branch, main, saves it, so test
      # builds from yuv-probe started each time with an empty Gradle home).
      # Self-hosted: no GitHub cache, the Gradle home stays on the runner.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-disabled: ${{ vars.RUNNER == 'self-hosted' }}

      # Compiler cache for the native code: unchanged C++ files are not rebuilt.
      # Self-hosted: ccache is installed and its directory stays on the runner, so the action is skipped.
      - uses: hendrikmuhs/ccache-action@v1.2
        if: vars.RUNNER != 'self-hosted'
        with:
          key: native-arm64
          max-size: 2G

      # Robolectric fetches its android-all runtime (~151 MB, MavenArtifactFetcher) from Maven Central the
      # first time a test runs, and one failed download fails every Robolectric test in the run. Keep the jar
      # between builds and fetch it here with retries, so the tests themselves need no network.
      - uses: actions/cache@v4
        if: vars.RUNNER != 'self-hosted'
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-14-robolectric-10818077-i7

      - name: Fetch Robolectric android runtime
        continue-on-error: true
        run: |
          # Keep in sync with @Config(sdk = [34]) and the robolectric version in app/build.gradle.kts
          # (Robolectric builds the artifact name as <androidVersion>-robolectric-<buildId>-i<preinstrumented>).
          version=14-robolectric-10818077-i7
          jar="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
          if [ -s "$jar" ]; then
            echo "Robolectric runtime already present: $(du -h "$jar" | cut -f1)"
            exit 0
          fi
          mkdir -p "$(dirname "$jar")"
          for repo in https://repo1.maven.org/maven2 https://repo.maven.apache.org/maven2; do
            echo "Fetching $version from $repo"
            if curl -fSL --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                 -o "$jar.part" \
                 "$repo/org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"; then
              mv "$jar.part" "$jar"
              echo "Fetched $(du -h "$jar" | cut -f1)"
              exit 0
            fi
          done
          echo "::warning::Robolectric runtime not fetched; unit tests may fail with MavenArtifactFetcher errors"
          exit 1

      # One Gradle run for both (shared configuration). Add [skip tests] to the
      # commit message to only assemble.
      - name: Unit tests + assemble debug APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # Hash the compiler by content (the NDK comes from a cache) and paths relative to the checkout.
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          SKIP_TESTS: ${{ github.event.inputs.skip_tests == 'true' || contains(github.event.head_commit.message, '[skip tests]') }}
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
        run: |
          # Kept checkout: drop APKs from earlier builds so only this build's APK is published.
          rm -rf app/build/outputs/apk
          if [ "$VARIANT" = "benchmark" ]; then
            # Test build: skips lint (about a minute); the debug builds and releases still run it.
            ./gradlew :app:assembleBenchmark -x lintVitalAnalyzeBenchmark -x lintVitalReportBenchmark -x lintVitalBenchmark
          elif [ "$SKIP_TESTS" = "true" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:testDebugUnitTest :app:assembleDebug
          fi

      # (a private repository – the test builds', utalpt/rawr-dev – has a small artifact quota shared by the
      # account: its APK goes to the test-build prerelease instead; release files don't count against it)
      # Publishes the APK even when the unit tests fail: a test failure leaves the assembled APK usable for
      # device work, and the job still shows red. Cancellation skips it.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && !github.event.repository.private }}
        with:
          name: rawr-debug-${{ github.sha }}
          path: app/build/outputs/apk/*/*.apk
          retention-days: 14

      - name: Test build prerelease (private repository)
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf test-apk && mkdir -p test-apk && cp app/build/outputs/apk/*/*.apk test-apk/
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build test-apk/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test build" --notes "CI build of ${GITHUB_SHA} (${GITHUB_REF_NAME}) on ${RUNNER_NAME}."

      # SPIR-V of every embedded shader (arm64 build), renamed *.comp.spv for
      # the Adreno Offline Compiler (_debug\aoc.bat).
      - name: Collect shader SPIR-V
        run: |
          rm -rf shaders-spv && mkdir -p shaders-spv
          find app/.cxx app/build -path '*arm64-v8a*' -name '*.spv' 2>/dev/null | while read -r f; do
            cp -f "$f" "shaders-spv/$(basename "$f" .spv).comp.spv"
          done
          ls shaders-spv | wc -l

      # Only for the AOC analysis: a full artifact quota (private repository) must not fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: shaders-spv-${{ github.sha }}
          path: shaders-spv/
          retention-days: 3

      # Merges to main republish the `debug` prerelease so its download link
      # stays stable. PRs only keep the run artifact.
      - name: Publish debug prerelease
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/xiaomi-17u')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rawr-debug.apk
          gh release delete debug --cleanup-tag --yes || true
          gh release create debug rawr-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "Debug build of ${GITHUB_SHA::8}. Installs alongside release as Rawr Debug."

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !github.event.repository.private }}
        with:
          name: test-reports
          path: app/build/reports/tests/
